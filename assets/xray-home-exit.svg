<svg xmlns="http://www.w3.org/2000/svg" width="590" height="230" viewBox="0 0 590 230">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b69cff" stop-opacity=".12"/>
      <stop offset=".55" stop-color="#0d1116" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Liberation Mono',Menlo,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
    @keyframes flow{to{stroke-dashoffset:-24}}
    .in{animation:rise .8s ease-out both}
    .arr{animation:nudge 2.4s ease-in-out infinite}
    .tun{stroke-dasharray:8 4;animation:flow 1.2s linear infinite}
  </style>
  <rect x=".5" y=".5" width="589" height="229" rx="18" fill="#0d1116" stroke="#1f252d"/>
  <rect x=".5" y=".5" width="589" height="229" rx="18" fill="url(#bg)"/>
  <rect x="40" y="0" width="64" height="3" rx="1.5" fill="#b69cff"/>
  <g class="in">
    <!-- ev ⇢ sunucu simgesi -->
    <path d="M40 60 58 44 76 60" fill="none" stroke="#b69cff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="45" y="58" width="26" height="18" rx="2" fill="none" stroke="#b69cff" stroke-width="2"/>
    <path d="M80 62H112" fill="none" stroke="#78ffb4" stroke-width="2" class="tun"/>
    <rect x="116" y="46" width="30" height="12" rx="3" fill="none" stroke="#5b6573" stroke-width="2"/>
    <rect x="116" y="62" width="30" height="12" rx="3" fill="none" stroke="#5b6573" stroke-width="2"/>
    <circle cx="140" cy="52" r="1.8" fill="#78ffb4"/><circle cx="140" cy="68" r="1.8" fill="#b69cff"/>
    <g class="arr"><path d="M536 66 552 50M540 50h12v12" fill="none" stroke="#5b6573" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="40" y="112" class="mono" font-size="22" font-weight="700" fill="#e8ecf1">xray-home-exit</text>
    <text x="40" y="140" class="sans" font-size="15" fill="#c3cad3">Sunucuna bağlan, ev internetinden çık — VLESS Reverse köprüsü</text>
    <text x="40" y="160" class="sans" font-size="14" fill="#6b7684">Connect to your VPS, exit through your home IP</text>
    <rect x="40" y="170" width="62" height="26" rx="7" fill="#12161b" stroke="#2a323c"/><text x="71" y="187" class="mono" font-size="12" fill="#8a94a3" text-anchor="middle">Shell</text><rect x="110" y="170" width="102" height="26" rx="7" fill="#12161b" stroke="#2a323c"/><text x="161" y="187" class="mono" font-size="12" fill="#8a94a3" text-anchor="middle">PowerShell</text><rect x="220" y="170" width="54" height="26" rx="7" fill="#12161b" stroke="#2a323c"/><text x="247" y="187" class="mono" font-size="12" fill="#8a94a3" text-anchor="middle">Xray</text><rect x="282" y="170" width="78" height="26" rx="7" fill="#12161b" stroke="#2a323c"/><text x="321" y="187" class="mono" font-size="12" fill="#8a94a3" text-anchor="middle">OpenWrt</text><rect x="368" y="170" width="110" height="26" rx="7" fill="#12161b" stroke="#2a323c"/><text x="423" y="187" class="mono" font-size="12" fill="#8a94a3" text-anchor="middle">Raspberry Pi</text>
  </g>
</svg>
