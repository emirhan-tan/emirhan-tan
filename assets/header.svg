<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c0f"/>
      <stop offset="1" stop-color="#0c1712"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".18" cy=".25" r=".55">
      <stop offset="0" stop-color="#78ffb4" stop-opacity=".20"/>
      <stop offset="1" stop-color="#78ffb4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".88" cy=".9" r=".5">
      <stop offset="0" stop-color="#b69cff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#b69cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78ffb4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#78ffb4"/>
      <stop offset="1" stop-color="#78ffb4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="340" rx="22"/></clipPath>
    <clipPath id="l1"><rect x="760" y="96" height="22" width="0"><animate attributeName="width" from="0" to="380" dur=".7s" begin=".9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="760" y="122" height="22" width="0"><animate attributeName="width" from="0" to="380" dur=".7s" begin="1.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="760" y="148" height="22" width="0"><animate attributeName="width" from="0" to="380" dur=".7s" begin="2.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="760" y="174" height="22" width="0"><animate attributeName="width" from="0" to="380" dur=".7s" begin="2.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="760" y="200" height="22" width="0"><animate attributeName="width" from="0" to="380" dur=".7s" begin="3.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="760" y="226" height="22" width="0"><animate attributeName="width" from="0" to="380" dur=".7s" begin="3.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l7"><rect x="760" y="252" height="22" width="0"><animate attributeName="width" from="0" to="380" dur=".5s" begin="4.5s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Liberation Mono',Menlo,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .k{fill:#b69cff}.v{fill:#7cc7ff}.s{fill:#78ffb4}.n{fill:#ffb86b}.p{fill:#6b7684}.c{fill:#4b5563}
    @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes blink{50%{opacity:0}}
    @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes ping{0%{r:5;opacity:.7}100%{r:14;opacity:0}}
    @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes sweep{from{transform:translateX(-1200px)}to{transform:translateX(1200px)}}
    .r1{animation:rise .8s .05s ease-out both}
    .r2{animation:rise .8s .2s ease-out both}
    .r3{animation:rise .8s .35s ease-out both}
    .r4{animation:rise .8s .5s ease-out both}
    .win{animation:fade 1s .4s ease-out both}
    .cur{animation:blink 1s steps(1) infinite}
    .glow{animation:breathe 7s ease-in-out infinite}
    .ping{animation:ping 2s ease-out infinite}
    .float{animation:drift 6s ease-in-out infinite}
    .float2{animation:drift 7s 1.5s ease-in-out infinite}
    .sweep{animation:sweep 6s linear infinite}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect class="glow" width="1200" height="340" fill="url(#glowA)"/>
    <rect width="1200" height="340" fill="url(#glowB)"/>
    <rect class="sweep" y="0" width="1200" height="2" fill="url(#edge)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="22" fill="none" stroke="#1f252d"/>

  <!-- left: identity -->
  <g class="r1">
    <rect x="64" y="58" width="252" height="32" rx="16" fill="#12161b" stroke="#2a323c"/>
    <circle class="ping" cx="84" cy="74" r="5" fill="#78ffb4"/>
    <circle cx="84" cy="74" r="4.5" fill="#78ffb4"/>
    <text x="98" y="79" class="mono" font-size="13" fill="#8a94a3">@emirhan-tan · İstanbul, TR</text>
  </g>
  <text x="62" y="168" class="sans r2" font-size="76" font-weight="800" fill="#e8ecf1" letter-spacing="-2.5">Emirhan Tan<tspan fill="#78ffb4">.</tspan></text>
  <text x="66" y="214" class="mono r3" font-size="21" fill="#78ffb4">Yazılım Geliştirici <tspan fill="#5b6573">·</tspan> Software Developer</text>
  <text x="66" y="250" class="sans r3" font-size="17" fill="#8a94a3">Bilgisayar Programcılığı · Computer Programming @ İstanbul Gelişim Üniversitesi</text>
  <g class="r4">
    <text x="66" y="294" class="mono" font-size="15" fill="#5b6573"><tspan fill="#78ffb4">$</tspan> stack <tspan fill="#e8ecf1">JavaScript · PHP · Python · C · C# · HTML/CSS</tspan></text>
    <rect class="cur" x="520" y="281" width="9" height="17" fill="#78ffb4"/>
  </g>

  <!-- right: code window -->
  <g class="win">
    <g class="float">
      <rect x="736" y="44" width="408" height="252" rx="14" fill="#11161c" stroke="#2a323c"/>
      <path d="M736 82h408" stroke="#1f252d"/>
      <circle cx="758" cy="63" r="5.5" fill="#ff5f57"/>
      <circle cx="776" cy="63" r="5.5" fill="#febc2e"/>
      <circle cx="794" cy="63" r="5.5" fill="#28c840"/>
      <text x="816" y="68" class="mono" font-size="12" fill="#5b6573">emirhan.js</text>
      <g class="mono" font-size="14" xml:space="preserve" style="white-space:pre">
        <text x="764" y="112" clip-path="url(#l1)"><tspan class="k">const</tspan> <tspan class="v">emirhan</tspan> <tspan class="p">= {</tspan></text>
        <text x="764" y="138" clip-path="url(#l2)"><tspan class="p">  role:</tspan> <tspan class="s">"Developer"</tspan><tspan class="p">,</tspan></text>
        <text x="764" y="164" clip-path="url(#l3)"><tspan class="p">  school:</tspan> <tspan class="s">"İGÜ · CP"</tspan><tspan class="p">,</tspan></text>
        <text x="764" y="190" clip-path="url(#l4)"><tspan class="p">  stack:</tspan> <tspan class="p">[</tspan><tspan class="s">"JS"</tspan><tspan class="p">,</tspan> <tspan class="s">"PHP"</tspan><tspan class="p">,</tspan> <tspan class="s">"C#"</tspan><tspan class="p">],</tspan></text>
        <text x="764" y="216" clip-path="url(#l5)"><tspan class="p">  city:</tspan> <tspan class="s">"İstanbul"</tspan><tspan class="p">,</tspan></text>
        <text x="764" y="242" clip-path="url(#l6)"><tspan class="p">  coffee:</tspan> <tspan class="n">Infinity</tspan></text>
        <text x="764" y="268" clip-path="url(#l7)"><tspan class="p">};</tspan></text>
      </g>
    </g>
    <g class="float2">
      <rect x="1036" y="24" width="132" height="30" rx="9" fill="#12161b" stroke="#2a323c"/>
      <text x="1102" y="44" class="mono" font-size="12" fill="#ffb86b" text-anchor="middle">&lt;/&gt; full-stack</text>
    </g>
    <g class="float">
      <rect x="704" y="276" width="140" height="30" rx="9" fill="#12161b" stroke="#2a323c"/>
      <text x="774" y="296" class="mono" font-size="12" fill="#7cc7ff" text-anchor="middle">✓ build passing</text>
    </g>
  </g>
</svg>
