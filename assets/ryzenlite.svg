<svg xmlns="http://www.w3.org/2000/svg" width="590" height="230" viewBox="0 0 590 230">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78ffb4" stop-opacity=".10"/>
      <stop offset=".55" stop-color="#0d1116" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Liberation Mono',Menlo,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
    .in{animation:rise .8s ease-out both}
    .arr{animation:nudge 2.4s ease-in-out infinite}
  </style>
  <rect x=".5" y=".5" width="589" height="229" rx="18" fill="#0d1116" stroke="#1f252d"/>
  <rect x=".5" y=".5" width="589" height="229" rx="18" fill="url(#bg)"/>
  <rect x="40" y="0" width="64" height="3" rx="1.5" fill="#78ffb4"/>
  <g class="in">
    <path d="M40 46a5 5 0 0 1 5-5h11l5 5h20a5 5 0 0 1 5 5v19a5 5 0 0 1-5 5H45a5 5 0 0 1-5-5Z" fill="none" stroke="#78ffb4" stroke-width="2"/>
    <g class="arr"><path d="M536 66 552 50M540 50h12v12" fill="none" stroke="#5b6573" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="40" y="112" class="mono" font-size="22" font-weight="700" fill="#e8ecf1">ryzenlite</text>
    <text x="40" y="140" class="sans" font-size="15" fill="#c3cad3">OpenWrt için Xray tabanlı seçici tünel ve modern LuCI paneli</text>
    <text x="40" y="160" class="sans" font-size="14" fill="#6b7684">Xray-based selective tunnel &amp; modern LuCI panel for OpenWrt</text>
    <rect x="40" y="170" width="78" height="26" rx="7" fill="#12161b" stroke="#2a323c"/><text x="79" y="187" class="mono" font-size="12" fill="#8a94a3" text-anchor="middle">OpenWrt</text><rect x="126" y="170" width="54" height="26" rx="7" fill="#12161b" stroke="#2a323c"/><text x="153" y="187" class="mono" font-size="12" fill="#8a94a3" text-anchor="middle">LuCI</text><rect x="188" y="170" width="54" height="26" rx="7" fill="#12161b" stroke="#2a323c"/><text x="215" y="187" class="mono" font-size="12" fill="#8a94a3" text-anchor="middle">Xray</text><rect x="250" y="170" width="142" height="26" rx="7" fill="#12161b" stroke="#2a323c"/><text x="321" y="187" class="mono" font-size="12" fill="#8a94a3" text-anchor="middle">VLESS / REALITY</text><rect x="400" y="170" width="70" height="26" rx="7" fill="#12161b" stroke="#2a323c"/><text x="435" y="187" class="mono" font-size="12" fill="#8a94a3" text-anchor="middle">TPROXY</text>
  </g>
</svg>
